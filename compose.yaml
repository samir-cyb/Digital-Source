# Development PostgreSQL target; migrate and verify RLS before multiuser rollout.
services:
  db:
    image: postgres:18.3
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: digital_source
      POSTGRES_USER: ds_migrator
      POSTGRES_PASSWORD: ${DS_POSTGRES_PASSWORD:?Set DS_POSTGRES_PASSWORD in your environment}
    volumes:
      - ds_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ds_migrator -d digital_source"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  ds_postgres:

